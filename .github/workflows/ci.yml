name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET (8 runtime for tests, 10 SDK for build)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore
        run: dotnet restore SafyaClinic/SafyaClinic.sln

      - name: Build
        run: dotnet build SafyaClinic/SafyaClinic.sln --no-restore --configuration Release

      - name: Test (.NET)
        run: >
          dotnet test SafyaClinic/SafyaClinic.sln --no-build --configuration Release
          --logger "trx;LogFileName=dotnet-tests.trx" --results-directory TestResults

      - name: Test (JavaScript)
        run: node --test "SafyaClinic/tests/**/*.test.cjs"
      
      - name: Migrations match the model (and produce the review script)
        run: |
          mkdir -p TestResults
          dotnet run --project SafyaClinic/tests/DeploymentChecks --configuration Release -- TestResults/migrations-idempotent.sql

      - name: Vulnerable packages
        run: |
          dotnet list SafyaClinic/SafyaClinic.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # M2a: the payment dashboard with 50,000 reservations in a real SQL Server, timed (target p95 under 1 s),
  # and checked against the pre-M2 figures. The schema is built by running the reviewed idempotent migration
  # script on an empty database, so a script that fails on a fresh database (as on 9 Nov) is caught here.
  # Report-only for now (continue-on-error). Passwords are generated per run.
  performance:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET (8 runtime, 10 SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Generate a password for this run
        run: |
          SA_PASSWORD="Sa1!$(openssl rand -hex 16)"
          echo "::add-mask::$SA_PASSWORD"
          echo "SA_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"

      - name: Start SQL Server
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker logs sql 2>&1 | grep -q "SQL Server is now ready for client connections"; then exit 0; fi
            sleep 2
          done
          docker logs sql; exit 1

      - name: Build the empty database from the idempotent migration script
        run: |
          dotnet run --project SafyaClinic/tests/DeploymentChecks --configuration Release -- migrations-idempotent.sql
          docker cp migrations-idempotent.sql sql:/tmp/migrations.sql
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$SA_PASSWORD" \
            -Q "CREATE DATABASE SafyaPerf COLLATE SQL_Latin1_General_CP1_CI_AS"
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -b -I -S localhost -U sa -P "$SA_PASSWORD" -d SafyaPerf \
            -i /tmp/migrations.sql > script-output.txt 2>&1 || { tail -n 40 script-output.txt; exit 1; }
          echo "Migration script ran without errors."

      - name: Time the payment dashboard with 50,000 reservations
        run: |
          export PERF_DB="Server=localhost,1433;Database=SafyaPerf;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True"
          dotnet run --project SafyaClinic/tests/PerformanceChecks --configuration Release -- 50000

  # P7: the pilot flow end to end in a browser (Playwright), with axe and screen-size checks, against a
  # fresh SQL Server in a container. Report-only for now (continue-on-error): once it is reliably green,
  # mark "e2e" as required in the branch protection rules. All passwords are generated per run.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET (8 runtime, 10 SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate passwords for this run
        run: |
          SA_PASSWORD="Sa1!$(openssl rand -hex 16)"
          ADMIN_PASSWORD="Ad1!$(openssl rand -hex 16)"
          USER_PASSWORD="Us1!$(openssl rand -hex 16)"
          echo "::add-mask::$SA_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$USER_PASSWORD"
          echo "SA_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_USER_PASSWORD=$USER_PASSWORD" >> "$GITHUB_ENV"

      - name: Start SQL Server
        run: |
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker logs sql 2>&1 | grep -q "SQL Server is now ready for client connections"; then exit 0; fi
            sleep 2
          done
          docker logs sql; exit 1

      - name: Build the app
        run: dotnet build SafyaClinic/SafyaClinic.Web/SafyaClinic.Web.csproj --configuration Release

      - name: Start the app (Development settings, migrations applied at start-up, fresh database)
        run: |
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS=http://localhost:5070
          export Database__MigrateOnStartup=true
          export ConnectionStrings__SafyaClinicDb="Server=localhost,1433;Database=SafyaClinicE2E;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True"
          export Seed__AdminPassword="$E2E_ADMIN_PASSWORD"
          # M1b: run the clinic clock at about 10:00, whatever the hour, so today always has free times to book.
          offset=$(( (10 - 10#$(date -u +%H) + 24) % 24 )); if [ "$offset" -gt 14 ]; then offset=$(( offset - 24 )); fi
          if [ "$offset" -ge 0 ]; then export Clinic__TimeZone="Etc/GMT-$offset"; else export Clinic__TimeZone="Etc/GMT+$(( -offset ))"; fi
          echo "Clinic time zone for this run: $Clinic__TimeZone"
          nohup dotnet run --project SafyaClinic/SafyaClinic.Web --configuration Release --no-build --no-launch-profile > app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5070/health | grep -q Healthy; then exit 0; fi
            sleep 2
          done
          cat app.log; exit 1

      - name: Install Playwright
        working-directory: SafyaClinic/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the pilot flow (Playwright + axe)
        working-directory: SafyaClinic/e2e
        env:
          E2E_BASE_URL: http://localhost:5070
        run: npx playwright test

      - name: Summary
        if: always()
        run: cat SafyaClinic/e2e/results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            SafyaClinic/e2e/results
            SafyaClinic/e2e/playwright-report
            SafyaClinic/e2e/test-results
            app.log
